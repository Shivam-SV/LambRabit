name: Runtimes

# Builds Apache, Nginx, PHP, Redis and Memcached for Linux and macOS (see build/linux/),
# repackages Memcached for Windows, and publishes them, with manifest.json, to the
# "binaries" release that the app's Services page reads. Builds already published are
# skipped, so this only does work when versions.env changes or PHP has a new patch release.
on:
  push:
    branches: [main]
    paths: ["build/linux/**", ".github/workflows/binaries.yml"]
  schedule:
    - cron: "0 5 * * 1" # Mondays: picks up new PHP patch releases
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild and replace builds that are already published"
        type: boolean
        default: false
      only:
        description: "With rebuild: only these runtimes, space-separated (e.g. php); empty for all"
        type: string
        default: ""
      publish:
        description: "Publish to the binaries release (untick to only test that the builds work)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: linux-runtimes
  cancel-in-progress: false

env:
  RELEASE_TAG: binaries

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild || false }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          . build/linux/versions.env
          gh release download "$RELEASE_TAG" -p manifest.json -D /tmp 2>/dev/null || echo '{"releases":[]}' > /tmp/manifest.json
          export NGINX_VERSIONS APACHE_VERSIONS PHP_LINES PHP_LINES_NOT_MACOS REDIS_VERSIONS MEMCACHED_VERSIONS
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          have = {(e["runtime"], e["version"], e.get("os", "linux"), e["arch"]) for e in json.load(open("/tmp/manifest.json"))["releases"]}
          if os.environ["REBUILD"] == "true":
              # Everything, or only the runtimes named (a build-script fix for one of them).
              only = os.environ["ONLY"].split()
              have = {h for h in have if only and h[0] not in only}
          wanted = [("nginx", v) for v in os.environ["NGINX_VERSIONS"].split()]
          wanted += [("apache", v) for v in os.environ["APACHE_VERSIONS"].split()]
          wanted += [("redis", v) for v in os.environ["REDIS_VERSIONS"].split()]
          wanted += [("memcached", v) for v in os.environ["MEMCACHED_VERSIONS"].split()]
          for line in os.environ["PHP_LINES"].split():
              with urllib.request.urlopen(f"https://www.php.net/releases/?json&version={line}") as r:
                  wanted.append(("php", json.load(r)["version"]))
          # Linux builds run in Debian 11 (glibc 2.31); macOS builds natively on each CPU.
          platforms = [
              ("linux", "x86_64", "ubuntu-24.04", "debian:bullseye"),
              ("linux", "aarch64", "ubuntu-24.04-arm", "debian:bullseye"),
              ("macos", "x86_64", "macos-15-intel", ""),
              ("macos", "aarch64", "macos-latest", ""),
          ]
          not_macos = os.environ["PHP_LINES_NOT_MACOS"].split()
          skip = lambda k, v, o: k == "php" and o == "macos" and ".".join(v.split(".")[:2]) in not_macos
          # PHP is static against musl, so it doesn't need the old glibc; it builds on the
          # runner itself, whose CMake is new enough for static-php-cli (Debian 11's isn't).
          include = [{"kind": k, "version": v, "os": o, "arch": a, "runner": r, "container": "" if k == "php" else c, "args": ""}
                     for k, v in wanted for o, a, r, c in platforms if (k, v, o, a) not in have and not skip(k, v, o)]
          # Memcached for Windows is nono303's build, repackaged (nothing to compile).
          include += [{"kind": "memcached", "version": v, "os": "windows", "arch": "x86_64", "runner": "ubuntu-24.04", "container": "debian:bullseye", "args": "windows"}
                      for v in os.environ["MEMCACHED_VERSIONS"].split() if ("memcached", v, "windows", "x86_64") not in have]
          print(f"matrix={json.dumps({'include': include})}")
          print(f"empty={'true' if not include else 'false'}")
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.kind }} ${{ matrix.version }} (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Linux builds use glibc 2.31, so they run on Ubuntu 20.04+, Debian 11+, Fedora 32+ and
    # anything newer (PHP is fully static either way). macOS builds run on the runner itself.
    container: ${{ matrix.container }}
    steps:
      - name: Build tools (Linux)
        if: matrix.container != ''
        run: |
          # Debian 11's support has ended: its packages (security updates included) now
          # live on archive.debian.org; deb.debian.org still lists them but returns 404.
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g' \
            /etc/apt/sources.list $(ls /etc/apt/sources.list.d/* 2>/dev/null)
          apt-get update -qq
          apt-get install -y -qq build-essential curl ca-certificates gnupg bzip2 xz-utils unzip patchelf perl python3 file git >/dev/null
      - name: Build tools (macOS)
        if: matrix.os == 'macos'
        # Nginx's release signatures need gpg; static-php-cli installs its own tools.
        run: command -v gpg >/dev/null || brew install gnupg
      - uses: actions/checkout@v5
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }} # static-php-cli downloads sources from GitHub
          # The app supports macOS 11+; without this, binaries need the runner's macOS.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: bash build/linux/build-${{ matrix.kind }}.sh ${{ matrix.version }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.kind }}-${{ matrix.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    # Publishes whatever built, so one failing PHP line doesn't hold back the rest. A manual
    # run can skip it to test build-script changes from a branch.
    if: ${{ !cancelled() && needs.build.result != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release is never "latest", so the app updater keeps finding app releases.
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" \
            --title "lampRabit runtimes" --prerelease --latest=false \
            --notes "Apache, Nginx, PHP, Redis and Memcached for Linux and macOS, and Memcached for Windows (nono303's Cygwin build, https://github.com/nono303/memcached), downloaded by lampRabit's Services page. Built by .github/workflows/binaries.yml from build/linux/; checksums are in manifest.json. Sources: https://github.com/redis/redis, https://github.com/memcached/memcached, Cygwin https://cygwin.com/"
          gh release download "$RELEASE_TAG" -p manifest.json -D /tmp 2>/dev/null || true
          python3 build/linux/manifest.py out /tmp/manifest.json > manifest.json
          gh release upload "$RELEASE_TAG" out/*.tar.gz manifest.json --clobber
