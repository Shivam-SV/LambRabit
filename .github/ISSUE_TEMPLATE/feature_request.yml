name: Feature request
description: Suggest an idea for lampRabit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like lampRabit to do?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: For example in XAMPP, Laragon, Herd or by hand.
