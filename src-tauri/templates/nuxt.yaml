schema: 1
id: nuxt
name: Nuxt
description: Nuxt, the Vue framework for full-stack apps, with the modules you pick.
icon: layers
color: teal
duration: npm · about a minute
requires:
  node: true
# nuxi init's own questions (nuxi init --help).
variables:
  - id: starter
    label: Starter
    type: choice
    default: minimal
    options:
      - { value: minimal, label: Minimal (a single app.vue) }
      - { value: content, label: Content-driven website (Nuxt Content) }
      - { value: ui, label: Nuxt UI }
  - id: modules
    label: Official modules
    type: multi
    separator: ","
    flag: '--modules "{value}"'
    options:
      - { value: "@nuxt/eslint", label: ESLint }
      - { value: "@nuxt/image", label: Image }
      - { value: "@nuxt/fonts", label: Fonts }
      - { value: "@nuxt/icon", label: Icon }
      - { value: "@nuxt/scripts", label: Scripts }
      - { value: "@nuxt/test-utils", label: Test utils }
steps:
  - name: Creating the project with nuxi
    cwd: www
    run: '{{pm.exec}} nuxi@latest init "{{project}}" --template {{vars.starter}} --packageManager {{pm}} --no-gitInit --force {{vars.modules}}'
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New Nuxt project
commands:
  discover: [package.json]
serve:
  mode: dynamic
  command: "{{pm.run}} dev {{pm.args}} --host 127.0.0.1 --port {port}"
done: Start it from the Sites page; it's served at {{url}}.
