schema: 1
id: express
name: Express
description: A small Express API in server.js, restarted when you save.
icon: box
color: amber
duration: npm · seconds
requires:
  node: true
steps:
  - name: Creating package.json
    write:
      path: package.json
      content: |
        {
          "name": "{{project}}",
          "version": "1.0.0",
          "private": true,
          "type": "module",
          "scripts": {
            "start": "node server.js",
            "dev": "node --watch server.js"
          }
        }
  - name: Creating server.js
    write:
      path: server.js
      content: |
        import express from "express";

        const app = express();
        app.use(express.json());

        app.get("/", (req, res) => {
          res.json({ message: "Hello from {{project}}", time: new Date().toISOString() });
        });

        // LampRabit passes the port it serves {{domain}} from.
        const port = process.env.PORT ?? 3000;
        app.listen(port, () => console.log(`Listening on http://127.0.0.1:${port}`));
  - name: Installing Express
    needs: [node]
    run: "{{pm.add}} express"
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New Express project
serve:
  mode: dynamic
  file: server.js
  watch: true
done: Start it from the Sites page; it's served at {{url}}.
