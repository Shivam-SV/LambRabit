schema: 1
id: drupal
name: Drupal
description: Drupal's recommended project, with the database settings filled in for the installer.
icon: droplet
color: blue
duration: Composer · a few minutes
requires:
  php: "8.3"
  extensions: [dom, gd, mbstring, pdo_mysql, simplexml, xml]
database: optional
steps:
  - create_database: {}
  - name: Creating the project with Composer (drupal/recommended-project)
    cwd: www
    composer: [create-project, drupal/recommended-project, "{{project}}", --prefer-dist, --no-interaction, --no-progress]
  - name: Writing settings.php
    copy:
      from: web/sites/default/default.settings.php
      to: web/sites/default/settings.php
  - name: Writing settings.php
    append:
      path: web/sites/default/settings.php
      content: |

        // Added by lampRabit.
        $settings['hash_salt'] = '{{random:64}}';
        $settings['config_sync_directory'] = '../config/sync';
        $settings['trusted_host_patterns'] = ['^{{domain}}$'];
  - name: Connecting the database
    if: database
    append:
      path: web/sites/default/settings.php
      content: |
        $databases['default']['default'] = [
          'database' => '{{database}}',
          'username' => '{{db.user}}',
          'password' => '{{db.password}}',
          'host' => '{{db.host}}',
          'port' => '{{db.port}}',
          'driver' => 'mysql',
          'prefix' => '',
          'collation' => 'utf8mb4_general_ci',
        ];
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New Drupal project
done: Open the site to run the Drupal installer; the database is already filled in.
