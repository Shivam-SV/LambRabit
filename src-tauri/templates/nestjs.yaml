schema: 1
id: nestjs
name: NestJS
description: A NestJS API, restarted when you save.
icon: boxes
color: rose
duration: npm · about a minute
requires:
  node: true
# The Nest CLI's own questions (nest new --help).
variables:
  - id: language
    label: Language
    type: choice
    default: TypeScript
    options: [TypeScript, JavaScript]
  - id: tests
    label: Generate test files
    type: bool
    default: "true"
    on: ""
    off: --skip-tests
steps:
  - name: Creating the project with the Nest CLI
    cwd: www
    run: '{{pm.exec}} @nestjs/cli@latest new "{{project}}" --package-manager {{pm}} --language {{vars.language}} {{vars.tests}} --skip-git --no-observe'
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New NestJS project
commands:
  discover: [package.json]
# src/main.ts listens on $PORT, which LampRabit sets.
serve:
  mode: dynamic
  command: "{{pm.run}} start:dev"
done: Start it from the Sites page; it's served at {{url}}.
