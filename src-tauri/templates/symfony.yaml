schema: 1
id: symfony
name: Symfony
description: Symfony skeleton with database and mailer set up.
icon: boxes
color: zinc
duration: Composer · about a minute
requires:
  php: "8.2"
  extensions: [ctype, mbstring, tokenizer, xml]
database: optional
steps:
  - create_database: {}
  - name: Creating the project with Composer (symfony/skeleton)
    cwd: www
    composer: [create-project, symfony/skeleton, "{{project}}", --prefer-dist, --no-interaction, --no-progress]
  - name: Configuring the mailer
    env:
      file: .env.local
      values:
        MAILER_DSN: "smtp://{{mail.host}}:{{mail.port}}"
  - name: Connecting the database
    if: database
    env:
      file: .env.local
      values:
        # Doctrine tells MariaDB and MySQL apart by serverVersion ("11.8.9-MariaDB" or "8.4.13").
        DATABASE_URL: '"mysql://{{db.user}}:{{db.password}}@{{db.host}}:{{db.port}}/{{database}}?serverVersion={{db.server_version}}&charset=utf8mb4"'
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New Symfony project
commands:
  discover: [console, composer.json]
  list:
    - name: Clear the cache
      run: php bin/console cache:clear
