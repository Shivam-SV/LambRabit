schema: 1
id: codeigniter
name: CodeIgniter
description: CodeIgniter 4 app starter in development mode, with database and mail set up.
icon: flame-kindling
color: orange
duration: Composer · about a minute
requires:
  php: "8.1"
  extensions: [intl, mbstring, mysqli]
database: optional
steps:
  - create_database: {}
  - name: Creating the project with Composer (codeigniter4/appstarter)
    cwd: www
    composer: [create-project, codeigniter4/appstarter, "{{project}}", --prefer-dist, --no-interaction, --no-progress]
  - name: Configuring the environment
    copy:
      from: env
      to: .env
  - name: Configuring the environment
    env:
      values:
        CI_ENVIRONMENT: development
        app.baseURL: "'{{url}}/'"
        email.protocol: smtp
        email.SMTPHost: "{{mail.host}}"
        email.SMTPPort: "{{mail.port}}"
  - name: Connecting the database
    if: database
    env:
      values:
        database.default.hostname: "{{db.host}}"
        database.default.database: "{{database}}"
        database.default.username: "{{db.user}}"
        database.default.password: "{{db.password}}"
        database.default.DBDriver: MySQLi
        database.default.port: "{{db.port}}"
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New CodeIgniter project
